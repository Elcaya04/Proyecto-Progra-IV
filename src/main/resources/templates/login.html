<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión - Bolsa de Empleo</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{layout :: navegacion}"></div>

<main class="login-container">
  <div class="login-card">
    <div class="login-icon-container text-center">
      <span class="login-icon">👤</span> </div>
    <h2 class="card-title text-center mt-1">Iniciar Sesión</h2>

    <div th:if="${param.exito}" class="alert-success mb-2 text-center">
      <p class="m-0 fw-bold"> Registro exitoso.</p>
      <p class="m-0" style="font-size: 13px;">Espera a que un Administrador apruebe tu cuenta para poder ingresar.</p>
    </div>

    <div th:if="${param.error}" class="alert-error">
      <p class="m-0"> Correo o contraseña incorrectos. Intentá de nuevo.</p>
    </div>

    <form th:action="@{/login}" method="post">

      <div class="form-group">
        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" name="email" class="form-control" required>
      </div>

      <div class="form-group">
        <label for="clave">Contraseña:</label>
        <input type="password" id="clave" name="clave" class="form-control" required>
      </div>

      <button type="submit" class="btn-primary">Entrar</button>
    </form>

    <p class="text-center mt-2">
      ¿No tienes cuenta? <a th:href="@{/registro}" class="link-primary">Regístrate aquí</a>
    </p>
  </div>
</main>

</body>
</html>
