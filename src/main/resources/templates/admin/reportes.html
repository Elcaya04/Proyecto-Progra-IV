<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reportes - Admin</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{layout :: navegacion}"></div>

<main class="dashboard-container">

    <header class="page-header text-left mb-3">
        <h1 class="page-title">Centro de Reportes</h1>
        <p class="page-subtitle">Generación de estadísticas e informes del sistema.</p>
    </header>

    <a th:href="@{/admin/dashboard}" class="link-back mb-2">️ Volver al Dashboard</a>

    <div class="card">
        <h3 class="text-primary mb-1"> Puestos Solicitados por Mes</h3>
        <p class="text-muted-dark mb-2">
            Selecciona el mes y año para generar el reporte PDF. Si no seleccionas ninguno,
            se descargarán todos los puestos registrados.
        </p>

        <form th:action="@{/admin/reportes/puestos-pdf}" method="get" class="d-flex gap-2 flex-wrap align-items-end">

            <div class="form-group" style="margin-bottom: 0;">
                <label for="mes">Mes:</label>
                <select id="mes" name="mes" class="form-control">
                    <option value="">-- Todos los meses --</option>
                    <option value="1">Enero</option>
                    <option value="2">Febrero</option>
                    <option value="3">Marzo</option>
                    <option value="4">Abril</option>
                    <option value="5">Mayo</option>
                    <option value="6">Junio</option>
                    <option value="7">Julio</option>
                    <option value="8">Agosto</option>
                    <option value="9">Septiembre</option>
                    <option value="10">Octubre</option>
                    <option value="11">Noviembre</option>
                    <option value="12">Diciembre</option>
                </select>
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <label for="anio">Año:</label>
                <select id="anio" name="anio" class="form-control">
                    <option value="">-- Todos los años --</option>
                    <option th:each="anio : ${anios}"
                            th:value="${anio}"
                            th:text="${anio}">
                        2026
                    </option>
                </select>
            </div>

            <button type="submit" class="btn-primary btn-auto" style="margin-bottom: 0;">
                Descargar PDF
            </button>

        </form>
    </div>

</main>

<div th:replace="~{layout :: pieDePagina}"></div>

</body>
</html>
