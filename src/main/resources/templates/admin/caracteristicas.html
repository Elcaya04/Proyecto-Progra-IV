<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Características - Admin</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{layout :: navegacion}"></div>

<main class="dashboard-container">
    <header class="page-header text-left mb-2">
        <h1 class="page-title">Características</h1>
    </header>

    <a th:href="@{/admin/dashboard}" class="link-back mb-2"> Volver al Dashboard</a>

    <div class="d-flex gap-3 flex-wrap">
        <div class="flex-2">
            <div class="card mb-2">
                <h3 class="card-title">Ruta</h3>
                <p class="m-0 text-muted-dark fw-500">
                    <a th:href="@{/admin/caracteristicas}" class="link-primary">Categorías: Raíces</a>
                    <span th:if="${padreActual != null}">
                        > <strong class="text-primary" th:text="${padreActual.nombre}">Subcategoría</strong>
                        <a th:if="${padreActual.padre != null}"
                           th:href="@{/admin/caracteristicas(padreId=${padreActual.padre.id})}"
                           class="text-info fw-bold text-decoration-none ml-1">(Subir un nivel)</a>
                    </span>
                </p>
            </div>

            <table class="data-table">
                <thead>
                <tr>
                    <th>Nombre de la Categoría</th>
                    <th class="text-center">Acción</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(caracteristicas)}">
                    <td colspan="2" class="text-center text-muted font-italic">No hay características en este nivel. ¡Agrega una!</td>
                </tr>
                <tr th:each="caracteristica : ${caracteristicas}">
                    <td class="fw-500" th:text="${caracteristica.nombre}">Bases de Datos</td>
                    <td class="text-center">
                        <a th:href="@{/admin/caracteristicas(padreId=${caracteristica.id})}" class="btn-primary btn-sm">Entrar </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="flex-1">
            <div class="card">
                <h3 class="card-title">Agregar Característica</h3>
                <form th:action="@{/admin/caracteristicas/guardar}" method="post">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" class="form-control" required placeholder="Ej: Bases de Datos">
                    </div>
                    <div class="form-group">
                        <label>Padre</label>
                        <input type="text" class="form-control input-disabled" disabled
                               th:value="${padreActual != null ? padreActual.nombre : 'Raíz (Categoría Principal)'}">
                        <input type="hidden" name="padreId" th:if="${padreActual != null}" th:value="${padreActual.id}">
                    </div>
                    <button type="submit" class="btn-primary">Crear</button>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout :: pieDePagina}"></div>

</body>
</html>
