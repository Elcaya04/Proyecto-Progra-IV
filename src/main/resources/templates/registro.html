<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro - Bolsa de Empleo UNA</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{layout :: navegacion}"></div>

<main class="login-container register-container">
    <div class="login-card register-card">

        <div th:if="${param.tipo == null}">
            <h2 class="card-title text-center">Crear una Cuenta</h2>
            <p class="text-center text-muted-dark">Selecciona el tipo de usuario para continuar:</p>

            <form th:action="@{/registro}" method="get">
                <div class="form-group">
                    <label for="tipo">¿Qué tipo de cuenta deseas crear?</label>
                    <select id="tipo" name="tipo" class="form-control" required>
                        <option value="OFERENTE">Soy un Oferente (Busco empleo)</option>
                        <option value="EMPRESA">Soy una Empresa (Busco talento)</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary mt-1">Continuar ➡️</button>
            </form>

            <p class="text-center mt-2">
                ¿Ya tienes una cuenta? <a th:href="@{/login}" class="link-primary">Inicia sesión aquí</a>
            </p>
        </div>

        <div th:if="${param.tipo != null}">
            <h2 class="card-title text-center" th:text="'Registro de ' + (${param.tipo[0] == 'EMPRESA'} ? 'Empresa' : 'Oferente')">Crear Cuenta</h2>

            <div th:if="${error}" class="alert-error">
                <p th:text="${error}" class="m-0"></p>
            </div>

            <form th:action="@{/registro}" method="post">
                <input type="hidden" name="tipoUsuario" th:value="${param.tipo[0]}">

                <div class="form-group">
                    <label for="nombre" th:text="${param.tipo[0] == 'EMPRESA'} ? 'Razón Social (Nombre de la empresa):' : 'Nombre Completo:'">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" class="form-control" required placeholder="tu@correo.com">
                </div>

                <div class="form-group">
                    <label for="clave">Contraseña:</label>
                    <input type="password" id="clave" name="clave" class="form-control" required placeholder="Mínimo 6 caracteres">
                </div>

                <div th:if="${param.tipo[0] == 'OFERENTE'}">
                    <div class="form-group"><label>Identificación:</label><input type="text" name="identificacion" class="form-control" required></div>
                    <div class="form-group"><label>Nacionalidad:</label><input type="text" name="nacionalidad" class="form-control" required></div>
                    <div class="form-group"><label>Teléfono:</label><input type="text" name="telefonoOferente" class="form-control" required></div>
                    <div class="form-group"><label>Lugar de Residencia:</label><input type="text" name="lugarResidencia" class="form-control" required></div>
                </div>

                <div th:if="${param.tipo[0] == 'EMPRESA'}">
                    <div class="form-group"><label>Teléfono de la Empresa:</label><input type="text" name="telefonoEmpresa" class="form-control" required></div>
                    <div class="form-group"><label>Localización (Sede principal):</label><input type="text" name="localizacion" class="form-control" required></div>
                    <div class="form-group"><label>Descripción de la Empresa:</label><textarea name="descripcion" class="form-control" rows="2" required></textarea></div>
                </div>

                <div class="d-flex gap-1 mt-2">
                    <button type="submit" class="btn-primary flex-1">Registrarse ✅</button>
                    <a th:href="@{/registro}" class="btn-primary btn-secondary btn-auto text-decoration-none text-center">⬅️ Atrás</a>
                </div>
            </form>
        </div>

    </div>
</main>

<div th:replace="~{layout :: pieDePagina}"></div>

</body>
</html>
